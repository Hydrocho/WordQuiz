<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10192e"><title>별과 우주 · 기억 퀴즈</title><link rel="stylesheet" href="styles.css"><script defer src="core.js"></script><script defer src="questions.js"></script><script defer src="app.js"></script></head>
<body><div class="shell">
 <header><div class="brand"><span class="logo" aria-hidden="true">✦</span><div><p class="eyebrow">SCIENCE MEMORY LAB</p><h1>별과 우주 <span>기억 퀴즈</span></h1></div></div><button id="recordsButton" class="record-button">오늘의 기록 <strong id="count">0 / 21</strong> ↗</button></header>
 <main><section class="board-panel" aria-label="글자 카드판"><div class="panel-heading"><div><span class="dot"></span> 기억 속 별을 찾아요</div><span>20 CARDS</span></div><div id="board" class="board"></div><div class="board-footer"><span>✧ 카드를 눌러 글자를 확인하세요</span><span>위치는 자유롭게 · 순서는 정확하게</span></div></section>
 <section class="question-panel"><div class="question-top"><span id="category" class="badge"></span><span id="progress"></span></div><div class="question-body"><p class="eyebrow">오늘의 탐구 문제</p><h2 id="question"></h2><div id="slots" class="slots" aria-label="선택한 정답 글자"></div><p id="feedback" role="status" aria-live="polite"></p></div><div class="question-bottom"><button id="next" class="primary" hidden>다음 문제로 →</button><p id="rule">틀리면 모든 카드가 다시 뒤집혀요.<br>기억한 위치에서 첫 글자부터 다시 도전!</p></div></section></main>
 <footer><span>중학교 과학 · 별과 우주</span><span id="storageStatus">기록은 이 기기의 브라우저에 저장돼요</span></footer>
</div><dialog id="records"><div class="dialog-heading"><div><p class="eyebrow" id="recordDate"></p><h2>오늘의 발견</h2></div><button id="closeRecords" aria-label="오늘의 기록 닫기">✕</button></div><p class="record-summary">오늘 맞힌 문제 <strong id="recordCount"></strong></p><p class="record-note">같은 문제는 하루에 한 번만 집계해요.</p><ol id="recordList"></ol><p id="emptyRecords">아직 완료한 문제가 없어요. 첫 번째 별을 찾아볼까요?</p></dialog></body></html>
